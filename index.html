<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STLデータ検索</title>
<meta name="description" content="NASのSTLデータをフォルダ指定で検索。サーバー不要、ブラウザだけで動作します。">
<style>
:root{--bg:#0e1424;--card:#171f36;--line:#2a3558;--txt:#e8ecf8;--sub:#8e9bc4;--ac:#5eead4;--ac2:#818cf8}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Yu Gothic UI",Meiryo,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#1d2a55 0,transparent 60%),var(--bg);color:var(--txt);min-height:100vh}
header{padding:24px 32px 8px}
h1{margin:0;font-size:24px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent}
header p{margin:4px 0 0;color:var(--sub);font-size:13px}
main{padding:16px 32px 40px;display:grid;gap:16px}
.card{background:rgba(23,31,54,.8);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:18px}
#drop{border:2px dashed var(--line);text-align:center;padding:32px;transition:.2s;cursor:pointer}
#drop.over{border-color:var(--ac);background:rgba(94,234,212,.08);transform:scale(1.01)}
#drop b{font-size:18px}#drop small{display:block;margin-top:6px;color:var(--sub)}
#status{margin-top:10px;color:var(--ac);font-size:13px;min-height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
input,select,button{font:inherit;color:var(--txt);background:#0f1730;border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none}
input:focus,select:focus{border-color:var(--ac)}
button{cursor:pointer;transition:.15s}button:hover{border-color:var(--ac);color:var(--ac)}
.btn{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#06101f;border:0;font-weight:600}
.btn:hover{color:#06101f;filter:brightness(1.1)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.count{color:var(--sub);font-size:13px}
.wrap{overflow:auto;max-height:60vh;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th{position:sticky;top:0;background:#1b2544;text-align:left;padding:10px 12px;cursor:pointer;user-select:none}
th:hover{color:var(--ac)}
td{padding:8px 12px;border-top:1px solid var(--line)}
tr:hover td{background:rgba(129,140,248,.1)}
.tag{background:rgba(94,234,212,.12);color:var(--ac);padding:2px 8px;border-radius:99px}
td button{padding:3px 8px;font-size:12px;margin-right:4px}
.dir{color:var(--sub);max-width:320px;overflow:hidden;text-overflow:ellipsis}
.note{color:var(--sub);font-size:12px;line-height:1.7}
</style>
</head>
<body>
<header>
  <h1>🦷 STLデータ検索</h1>
  <p>ブラウザだけで動作・サーバー不要・データはPCの外に送信されません</p>
</header>
<main>
  <section class="card" id="drop" tabindex="0">
    <b>📁 NASの製作日フォルダをここにドラッグ＆ドロップ</b>
    <small>またはクリックしてフォルダを選択（複数の製作日フォルダをまとめてドロップ可）</small>
    <div id="status"></div>
    <input id="picker" type="file" webkitdirectory multiple hidden>
  </section>

  <section class="card">
    <div class="grid">
      <label>歯科医院番号<input id="f-clinic" placeholder="例: 12345" inputmode="numeric"></label>
      <label>納期（から）<input id="f-from" type="date"></label>
      <label>納期（まで）<input id="f-to" type="date"></label>
      <label>材料<select id="f-material"><option value="">すべて</option></select></label>
      <label>シェード<select id="f-shade"><option value="">すべて</option></select></label>
      <label>部位<input id="f-site" placeholder="例: 16 または 16-17"></label>
      <label>通し番号<input id="f-serial" placeholder="例: 001"></label>
      <label>ファイル名に含む<input id="f-text" placeholder="自由入力"></label>
    </div>
    <div class="row">
      <button id="reset">条件クリア</button>
      <span class="count" id="count"></span>
    </div>
  </section>

  <section class="card">
    <div class="wrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>
    <p class="note">
      ※ ブラウザの仕様上、NASのフルパスは取得できません。代わりに「フォルダ/ファイル名」をコピーできます。<br>
      ※ ファイルの<b>作成日時</b>はブラウザから取得できないため、<b>更新日時</b>と、所属する<b>製作日フォルダ</b>を表示します。<br>
      ※ ファイル名の規則: 納期_材料_シェード_医院番号(5桁)_通し番号(3桁)_部位(例 14 / 16-17)
    </p>
  </section>
  <section class="card" id="bad" hidden>
    <b>命名規則に合わないSTL: <span id="bad-n"></span> 件</b>
    <div class="note" id="bad-list"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

// ===== ファイル名解析（命名規則が変わったらここを修正）=====
const MATERIALS = ["PR","CS3","DK","DHK"];
const SHADES = ["A1","A2","A3","A3.5","A4"];
const SEP = "[_\\-\\s]";
// シェードは A3.5 を A3 より先に判定する
const PATTERN = new RegExp(
  `^(\\d{8})${SEP}(${MATERIALS.join("|")})${SEP}(A3\\.5|A[1-4])${SEP}(\\d{5})${SEP}(\\d{3})${SEP}(\\d{2}(?:-\\d{2})*)(?:${SEP}.*)?$`, "i");

function parseName(name){
  const m = PATTERN.exec(name.slice(0,-4));
  if(!m) return null;
  const d = m[1], y=+d.slice(0,4), mo=+d.slice(4,6), dd=+d.slice(6,8), dt=new Date(y,mo-1,dd);
  if(dt.getMonth()!==mo-1 || dt.getDate()!==dd) return null;
  return {due:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`, material:m[2].toUpperCase(),
          shade:m[3].toUpperCase(), clinic:m[4], serial:m[5], site:m[6], sites:m[6].split("-")};
}

// プルダウンは固定リスト
for(const [id,list] of [["f-material",MATERIALS],["f-shade",SHADES]])
  $(id).insertAdjacentHTML("beforeend", list.map(v=>`<option>${v}</option>`).join(""));

// ===== 読み込み（2段階）=====
// 1段階目: フォルダ内のファイル名だけを高速に列挙して即表示
// 2段階目: 更新日時・サイズは必要な行だけ取得（表示中の行／更新日時順にしたときは絞り込み結果の全件）
let rows = [], bad = [], sortKey = "due", sortDir = -1, gen = 0;

function addName(name, relPath, src){
  if(!/\.stl$/i.test(name)) return;
  const meta = parseName(name);
  if(!meta){ bad.push(relPath); return; }
  rows.push({...meta, src, name, rel:relPath, dir:relPath.slice(0, relPath.length-name.length-1), modified:null, size:null});
}

function readAll(reader){
  return new Promise((res,rej)=>{
    const all=[]; (function next(){ reader.readEntries(es=>{ if(!es.length) return res(all); all.push(...es); next(); }, rej); })();
  });
}
async function walk(entry, path, my){
  if(my!==gen) return;
  if(entry.isFile) return addName(entry.name, path+entry.name, entry);
  if(!entry.isDirectory) return;
  const es = await readAll(entry.createReader());
  await Promise.all(es.map(e=>walk(e, path+entry.name+"/", my)));   // サブフォルダを並列に走査
}

const toFile = src => src instanceof File ? Promise.resolve(src) : new Promise((r,j)=>src.file(r,j));

let active = 0, waiting = [];
function limit(fn){ return new Promise(res=>{
  const run = ()=>{ active++; fn().finally(()=>{ active--; if(waiting.length) waiting.shift()(); }).then(res); };
  active<48 ? run() : waiting.push(run); }); }
function ensureMeta(r){
  if(r.p) return r.p;
  return r.p = limit(async()=>{ try{ const f=await toFile(r.src); r.modified=f.lastModified; r.size=f.size; }catch{ r.modified=0; r.size=0; } });
}
let tm=null;
function scheduleRender(){ if(tm) return; tm=setTimeout(()=>{ tm=null; render(); },300); }

function afterList(){
  $("status").textContent = `✅ STL ${rows.length} 件を検出（命名規則外 ${bad.length} 件）。ファイルの中身は読み込んでいません。`;
  $("bad").hidden = !bad.length; $("bad-n").textContent = bad.length;
  $("bad-list").textContent = bad.slice(0,100).join(" / ") + (bad.length>100?" …":"");
  render();
}

async function handleDrop(items){
  const my=++gen; rows=[]; bad=[]; $("status").textContent="フォルダを読み込み中…";
  const entries = [...items].map(i=>i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  await Promise.all(entries.map(e=>walk(e, "", my)));
  if(my===gen) afterList();
}
function handlePicker(files){
  ++gen; rows=[]; bad=[];
  for(const f of files){ const p=f.webkitRelativePath||f.name; addName(f.name, p, f); }
  rows.forEach(r=>{ r.modified=r.src.lastModified; r.size=r.src.size; r.p=Promise.resolve(); });
  afterList();
}

const drop = $("drop");
drop.addEventListener("click", ()=>$("picker").click());
$("picker").addEventListener("change", e=>handlePicker(e.target.files));
["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop", e=>handleDrop(e.dataTransfer.items));
// 画面のどこにドロップしても開かないようにする
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("drop",e=>{e.preventDefault(); if(!drop.contains(e.target)) handleDrop(e.dataTransfer.items);});

// ===== 検索・表示 =====
const COLS = [["due","納期"],["material","材料"],["shade","シェード"],["clinic","医院番号"],["serial","通し番号"],
  ["site","部位"],["modified","更新日時"],["dir","製作日フォルダ"],["name","ファイル名"],["size","サイズ"]];
$("tbl").tHead.innerHTML = "<tr>"+COLS.map(([k,l])=>`<th data-k="${k}">${l}<span id="s-${k}"></span></th>`).join("")+"<th>操作</th></tr>";
$("tbl").tHead.addEventListener("click", e=>{
  const k = e.target.closest("th")?.dataset.k; if(!k) return;
  sortDir = (sortKey===k) ? -sortDir : (k==="modified"?-1:1); sortKey=k; render();
});

const fmt = t => { const d=new Date(t), p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const kb = n => n>=1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(n/1024))+" KB";
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function filtered(){
  const v = id => $(id).value.trim();
  const clinic=v("f-clinic"), from=v("f-from"), to=v("f-to"), mat=v("f-material"), sh=v("f-shade"),
        serial=v("f-serial"), text=v("f-text").toLowerCase(),
        site=v("f-site").split(/[\s,\-，、]+/).filter(Boolean);
  return rows.filter(r=>
    (!clinic || r.clinic.includes(clinic)) && (!from || r.due>=from) && (!to || r.due<=to) &&
    (!mat || r.material===mat) && (!sh || r.shade===sh) && (!serial || r.serial.includes(serial)) &&
    (!text || r.name.toLowerCase().includes(text)) &&
    site.every(s=>r.sites.includes(s.padStart(2,"0"))));
}

function render(){
  const list = filtered().sort((a,b)=>{ const x=a[sortKey]??0, y=b[sortKey]??0;
    return (x<y?-1:x>y?1:0)*sortDir || a.name.localeCompare(b.name); });
  COLS.forEach(([k])=>$("s-"+k).textContent = k===sortKey ? (sortDir>0?" ▲":" ▼") : "");
  $("count").textContent = rows.length ? `${list.length} 件 / 全 ${rows.length} 件` : "";
  const shown = list.slice(0,300);
  const need = (sortKey==="modified"||sortKey==="size") ? list : shown;   // 更新日時順のときだけ絞り込み結果の全件を取得
  const todo = need.filter(r=>r.modified===null);
  todo.forEach(r=>ensureMeta(r).then(scheduleRender));
  if(todo.length) $("count").textContent += `（更新日時を取得中… 残り${todo.length}件）`;
  $("tbl").tBodies[0].innerHTML = shown.map((r,i)=>`<tr>
    <td>${r.due}</td><td><span class="tag">${r.material}</span></td><td>${r.shade}</td><td>${r.clinic}</td>
    <td>${r.serial}</td><td>${r.site}</td><td>${r.modified===null?"…":fmt(r.modified)}</td><td class="dir" title="${esc(r.dir)}">${esc(r.dir)||"-"}</td>
    <td>${esc(r.name)}</td><td>${r.size===null?"…":kb(r.size)}</td>
    <td><button data-a="copy" data-i="${i}">パスをコピー</button><button data-a="dl" data-i="${i}">DL</button></td></tr>`).join("");
  if(list.length>300) $("count").textContent += "（先頭300件を表示。条件を絞ってください）";
  render.shown = shown;
}
$("tbl").tBodies[0].addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b) return;
  const r = render.shown[+b.dataset.i];
  if(b.dataset.a==="copy"){
    try{ await navigator.clipboard.writeText(r.rel); }catch{ prompt("コピーしてください", r.rel); }
    b.textContent="✔ コピー済"; setTimeout(()=>b.textContent="パスをコピー",1200);
  } else {
    const f=await toFile(r.src);
    const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=r.name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }
});

document.querySelectorAll("#f-clinic,#f-from,#f-to,#f-material,#f-shade,#f-site,#f-serial,#f-text")
  .forEach(el=>el.addEventListener("input", render));
$("reset").onclick = ()=>{ document.querySelectorAll(".grid input,.grid select").forEach(el=>el.value=""); render(); };
render();
</script>
</body>
</html>
