<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ファイル検索ツール</title>
  <meta name="description" content="フォルダー内のファイルを材料・色・納期・得意先コード・通し番号・部位で高速検索するツール" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 画面全体ドロップ時のオーバーレイ -->
  <div id="dropOverlay" class="drop-overlay">ここにフォルダーをドロップ</div>

  <main class="container">
    <h1 class="title">ファイル検索ツール</h1>
    <div class="search-panel">
      <div class="drop-zone" id="dropZone">
        <div>
          <p class="drop-hint">フォルダーを画面のどこかにドラッグ＆ドロップ<br>または</p>
          <button id="chooseBtn" class="btn" type="button">フォルダーを選択</button>
          <input type="file" id="folderInput" webkitdirectory multiple />
          <p id="status" class="status">未読み込み</p>
          <button id="resetBtn" class="btn btn-sub btn-small" type="button" hidden>読み込みをリセット</button>
        </div>
      </div>
      <div class="filters">
        <select id="material">
          <option value="">材料（選択）</option>
          <option>PR</option><option>CS3</option><option>DK</option>
          <option>GL</option><option>DKH</option><option>YM</option>
        </select>
        <select id="color">
          <option value="">色（選択）</option>
          <option>A1</option><option>A2</option><option>A3</option>
          <option>A3.5</option><option>A4</option>
        </select>
        <input type="text" id="due" placeholder="納期 月日(例:1025)" />
        <input type="text" id="code" placeholder="取引先コード(5桁)" />
        <input type="text" id="seq" placeholder="通し番号(3桁)" />
        <input type="text" id="part" placeholder="部位(2桁)" />
        <label class="toggle-all">
          <input type="checkbox" id="matchAll" /> 全条件一致のみ表示
        </label>
        <button id="searchBtn" class="btn" type="button">検索</button>
        <button id="clearBtn" class="btn btn-sub" type="button">条件クリア</button>
      </div>
    </div>
    <div class="results" id="results"></div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const dropZone = $('dropZone'), folderInput = $('folderInput');
    const overlay = $('dropOverlay'), statusEl = $('status'), resultsDiv = $('results');
    const FIELDS = ['material', 'color', 'due', 'code', 'seq', 'part'];
    let fileList = [];

    // ---------- 読み込み完了時 ----------
    function onFilesLoaded(files) {
      fileList = files;
      statusEl.textContent = `${files.length} 件のファイルを読み込みました`;
      $('resetBtn').hidden = false;
      runSearch();
    }

    // ---------- フォルダー選択ボタン ----------
    $('chooseBtn').addEventListener('click', () => { folderInput.value = ''; folderInput.click(); });
    folderInput.addEventListener('change', e => onFilesLoaded(Array.from(e.target.files)));

    // ---------- ドラッグ＆ドロップ（画面全体で受付） ----------
    let dragDepth = 0;
    window.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; overlay.classList.add('show'); });
    window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; overlay.classList.remove('show'); } });
    window.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
    window.addEventListener('drop', async e => {
      e.preventDefault();               // ブラウザがフォルダーを開く（別タブのインデックス表示）のを防止
      dragDepth = 0; overlay.classList.remove('show');
      // entry / handle は drop イベント中に同期的に取得する必要がある
      const items = Array.from(e.dataTransfer.items || []).filter(it => it.kind === 'file');
      const entries = items.map(it => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
      const handlePromises = items.map(it => it.getAsFileSystemHandle ? it.getAsFileSystemHandle() : null).filter(Boolean);
      statusEl.textContent = '読み込み中...';
      try {
        onFilesLoaded((await Promise.all(entries.map(readEntry))).flat());
      } catch (err1) {
        // file:// で開いている場合 Chrome は上記APIを拒否する → File System Access API で再試行
        try {
          const handles = (await Promise.all(handlePromises)).filter(Boolean);
          if (!handles.length) throw err1;
          onFilesLoaded((await Promise.all(handles.map(readHandle))).flat());
        } catch (err2) {
          statusEl.innerHTML = location.protocol === 'file:'
            ? 'ブラウザの制限でドラッグ読み込みできません。<br>「フォルダーを選択」ボタンを使うか、<b>start.bat</b> から起動してください。'
            : '読み込みに失敗しました: ' + err2.message;
        }
      }
    });

    async function readHandle(h) {
      if (h.kind === 'file') return [await h.getFile()];
      const out = [];
      for await (const child of h.values()) out.push(...await readHandle(child));
      return out;
    }

    // エントリを再帰的に読み込み（readEntries は1回最大100件なので空になるまで繰り返す）
    async function readEntry(entry) {
      if (entry.isFile) return [await new Promise((res, rej) => entry.file(res, rej))];
      const reader = entry.createReader(), all = [];
      while (true) {
        const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        if (!batch.length) break;
        all.push(...batch);
      }
      return (await Promise.all(all.map(readEntry))).flat();
    }

    // ---------- ファイル名解析 ----------
    // 構成: 材料 色 納期(W/WW/WR/WWR+月日4桁) 取引先コード5桁 通し番号3桁 部位2桁
    // 区切り文字の有無・種類（_ - 空白）に関係なく桁数で判定する
    function parseName(name) {
      const base = name.replace(/\.[A-Za-z0-9]{1,5}$/, '');
      const p = base.split(/[_\-\s]+/);
      const info = { material: p[0] || '', color: p[1] || '', due: '', code: '', seq: '', part: '' };
      // 納期4桁(WW等の後) + 取引先5桁 + 通し番号3桁 + 部位2桁 を一括で判定（区切りの有無は問わない）
      const S = '[_\\-\\s]*';
      const m = base.match(new RegExp(`(?<!\\d)(\\d{4})${S}(\\d{5})${S}(\\d{3})${S}(\\d{2})(?!\\d)`));
      if (m) { [, info.due, info.code, info.seq, info.part] = m; }
      return info;
    }

    // ---------- 照合（一致した条件数をスコアとして返す） ----------
    function score(info, c) {
      const lc = s => s.toLowerCase();
      const tests = {
        material: () => lc(info.material) === lc(c.material),            // 完全一致（DK と DKH を区別）
        color:    () => lc(info.color) === lc(c.color),
        due:      () => info.due.includes(c.due),
        code:     () => info.code.includes(c.code),
        seq:      () => info.seq === c.seq.padStart(3, '0'),   // 「1」→「001」として完全一致
        part:     () => info.part === c.part.padStart(2, '0'), // 「1」→「01」として完全一致
      };
      const active = FIELDS.filter(f => c[f]);
      const miss = active.filter(f => !tests[f]());
      return { hit: active.length - miss.length, total: active.length, miss };
    }

    // ---------- 検索 ----------
    function runSearch() {
      const c = {};
      FIELDS.forEach(f => c[f] = $(f).value.trim());
      const requireAll = $('matchAll').checked;
      const list = fileList.map(file => {
        const info = parseName(file.name);
        return { file, info, ...score(info, c) };
      }).filter(r => r.total === 0 || (requireAll ? r.hit === r.total : r.hit > 0))
        .sort((a, b) => b.hit - a.hit || b.file.lastModified - a.file.lastModified);
      displayResults(list);
    }
    $('searchBtn').addEventListener('click', runSearch);
    FIELDS.forEach(f => $(f).addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); }));

    // 条件クリア: 検索条件と結果表示のみリセット（読み込んだファイルは保持）
    $('clearBtn').addEventListener('click', () => {
      FIELDS.forEach(f => $(f).value = '');
      $('matchAll').checked = false;
      resultsDiv.innerHTML = '';
      $('material').focus();
    });

    // 読み込みリセット: 取り込んだフォルダーの内容を破棄（検索条件は保持）
    $('resetBtn').addEventListener('click', () => {
      fileList = [];
      folderInput.value = '';
      resultsDiv.innerHTML = '';
      statusEl.textContent = '未読み込み';
      $('resetBtn').hidden = true;
    });

    // ---------- 結果表示（完全一致 と 部分一致の候補 を分けて表示） ----------
    const LABEL = { material: '材料', color: '色', due: '納期', code: '取引先', seq: '通番', part: '部位' };
    function displayResults(list) {
      resultsDiv.innerHTML = '';
      if (!fileList.length) return;
      const full = list.filter(r => r.hit === r.total);
      const partial = list.filter(r => r.hit < r.total);
      addSection(`✅ 完全一致 ${full.length} 件（全 ${fileList.length} 件中）`, full, true);
      if (partial.length) addSection(`部分一致の候補 ${partial.length} 件（赤字＝不一致の条件）`, partial, false);
    }
    function addSection(title, list, isFull) {
      const head = document.createElement('p');
      head.className = 'result-count' + (isFull ? '' : ' partial');
      head.textContent = title;
      resultsDiv.appendChild(head);
      const ul = document.createElement('ul');
      list.slice(0, 1000).forEach(({ file, info, hit, total, miss }) => {
        const li = document.createElement('li');
        if (isFull && total) li.classList.add('full-match');
        const fields = FIELDS.map(f => {
          const s = document.createElement('span');
          s.className = 'field' + (miss.includes(f) ? ' miss' : '');
          s.textContent = `${LABEL[f]}:${info[f] || '-'}`;
          return s;
        });
        const d = new Date(file.lastModified);
        li.innerHTML = `<div class="r-main"><div class="r-name"></div><div class="r-fields"></div></div>
          <div class="r-date"><span class="r-date-label">更新日時</span><span class="r-ymd"></span><span class="r-hm"></span></div>`;
        li.querySelector('.r-name').textContent = `${total ? `[${hit}/${total}] ` : ''}${file.name}`;
        li.querySelector('.r-fields').append(...fields);
        li.querySelector('.r-ymd').textContent = d.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
        li.querySelector('.r-hm').textContent = d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        ul.appendChild(li);
      });
      resultsDiv.appendChild(ul);
    }
  </script>
</body>
</html>
